services:
  web:
    build: .
    image: goodfind-ecommerce:latest
    environment:
      APP_MODULE: app
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-demo-secret-change-this}
      CATALOG_URL: http://catalog:8000
      CART_URL: http://cart:8000
      RECOMMENDATIONS_URL: http://recommendations:8000
      ORDERS_URL: http://orders:8000
    ports:
      - "127.0.0.1:5001:8000"
    depends_on:
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      recommendations:
        condition: service_healthy
      orders:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goodfind
      POSTGRES_USER: ${POSTGRES_USER:-goodfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - goodfind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-goodfind}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-local-demo-password}
    volumes:
      - goodfind-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 12

  catalog:
    build: .
    image: goodfind-ecommerce:latest
    command: ["sh", "-c", "exec gunicorn --bind=0.0.0.0:8000 --workers=1 --access-logfile=- microservices.catalog:app"]
    environment:
      MONGO_HOST: mongodb
      MONGO_USER: ${MONGO_USER:-goodfind}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-local-demo-password}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  cart:
    build: .
    image: goodfind-ecommerce:latest
    command: ["sh", "-c", "exec gunicorn --bind=0.0.0.0:8000 --workers=1 --access-logfile=- microservices.cart:app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: goodfind
      POSTGRES_USER: ${POSTGRES_USER:-goodfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      CATALOG_URL: http://catalog:8000
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  recommendations:
    build: .
    image: goodfind-ecommerce:latest
    command: ["sh", "-c", "exec gunicorn --bind=0.0.0.0:8000 --workers=1 --access-logfile=- microservices.recommendations:app"]
    environment:
      CATALOG_URL: http://catalog:8000
      ORDERS_URL: http://orders:8000
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  orders:
    build: .
    image: goodfind-ecommerce:latest
    command: ["sh", "-c", "exec gunicorn --bind=0.0.0.0:8000 --workers=1 --access-logfile=- microservices.orders:app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: goodfind
      POSTGRES_USER: ${POSTGRES_USER:-goodfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      CATALOG_URL: http://catalog:8000
      CART_URL: http://cart:8000
      INVENTORY_URL: http://inventory:8000
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  inventory:
    build: .
    image: goodfind-ecommerce:latest
    command: ["sh", "-c", "exec gunicorn --bind=0.0.0.0:8000 --workers=1 --access-logfile=- microservices.inventory:app"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: goodfind
      POSTGRES_USER: ${POSTGRES_USER:-goodfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  goodfind-postgres-data:
  goodfind-mongo-data:
