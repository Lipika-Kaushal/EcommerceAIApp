apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goodfind-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodfind
  labels:
    app: goodfind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goodfind
  template:
    metadata:
      labels:
        app: goodfind
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: goodfind
          image: goodfind:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_PATH
              value: /app/data/ecommerce.db
          volumeMounts:
            - name: app-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: goodfind-data
