apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: goodfind-ecommerce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_MODULE
              value: app
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: goodfind-secrets
                  key: flask-secret-key
            - name: CATALOG_URL
              value: http://catalog:8000
            - name: CART_URL
              value: http://cart:8000
            - name: RECOMMENDATIONS_URL
              value: http://recommendations:8000
            - name: ORDERS_URL
              value: http://orders:8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
